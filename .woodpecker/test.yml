when:
  - event: pull_request

steps:
  - name: test
    image: golang:1.25
    commands:
      - make lint
      - make test
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2
